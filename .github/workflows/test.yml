name: Test extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: node --check content.js
      - name: Run regression tests
        run: node --test tests/content.test.cjs
      - name: Validate extension manifest
        run: node -e "const fs = require('node:fs'); const assert = require('node:assert/strict'); const m = JSON.parse(fs.readFileSync('manifest.json', 'utf8')); assert.equal(m.manifest_version, 3); for (const s of m.content_scripts) for (const f of [...s.js, ...(s.css || [])]) assert.ok(fs.existsSync(f), f);"
