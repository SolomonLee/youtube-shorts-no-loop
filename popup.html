<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shorts 播完就停</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <h1>Shorts 播完就停</h1>
  <label class="setting" for="enabled">
    <span>播完自動停止</span>
    <input id="enabled" type="checkbox" role="switch" aria-describedby="status" disabled>
    <span class="switch" aria-hidden="true"></span>
  </label>
  <p id="status" role="status" aria-live="polite">讀取設定中…</p>
  <p class="hint">套用至所有 YouTube 分頁，並記住你的選擇。</p>
</body>
</html>
